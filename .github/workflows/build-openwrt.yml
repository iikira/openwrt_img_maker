name: Build OpenWrt Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenWrt 版本号 (例: 25.12.6)'
        required: true
        default: '25.12.6'
      size:
        description: '扩容大小 (MB)'
        required: true
        default: '1024'
      mirror:
        description: '下载镜像源'
        type: choice
        required: true
        default: 'https://mirrors.ustc.edu.cn/openwrt'
        options:
          - 'https://mirrors.ustc.edu.cn/openwrt'
          - 'https://mirrors.tuna.tsinghua.edu.cn/openwrt'
          - 'https://downloads.openwrt.org'

jobs:
  build:
    # 固定 runner 版本, 避免 ubuntu-latest 随 runner 更新导致
    # fdisk/util-linux 行为变化 (util-linux 2.37, fdisk 已验证)。
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        # gh release 需要本地 git 仓库来推断 owner/repo
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: |
          VERSION="${{ github.event.inputs.version }}"
          SIZE="${{ github.event.inputs.size }}"
          MIRROR="${{ github.event.inputs.mirror }}"
          # 版本号中的点，用于镜像路径 (24.10.1 -> 24.10.1)
          BASE="${VERSION}"
          FILE="openwrt-${BASE}-x86-64-generic-ext4-combined.img"
          OUT="openwrt-${BASE}-x86-64-generic-ext4-combined-resized.img.gz"
          URL="${MIRROR}/releases/${BASE}/targets/x86/64/${FILE}.gz"
          {
            echo "version=${VERSION}"
            echo "base=${BASE}"
            echo "file=${FILE}"
            echo "out=${OUT}"
            echo "url=${URL}"
            echo "size=${SIZE}"
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-utils util-linux gzip e2fsprogs jq
          echo "已安装关键工具版本:"
          dpkg-query -W util-linux e2fsprogs qemu-utils

      - name: Download image
        run: |
          curl -fL -o "${{ steps.vars.outputs.file }}.gz" "${{ steps.vars.outputs.url }}"
          gzip -d "${{ steps.vars.outputs.file }}.gz"
          ls -lh "${{ steps.vars.outputs.file }}"

      - name: Resize image
        run: |
          qemu-img resize "${{ steps.vars.outputs.file }}" +${{ steps.vars.outputs.size }}M

      - name: Expand root partition
        run: |
          set -euo pipefail
          IMG="${{ steps.vars.outputs.file }}"

          # 挂载镜像到 loop 设备 (需要 sudo 才能设置 loop 设备)
          LOOP=$(sudo losetup -f --show "$IMG")
          echo "LOOP=$LOOP"
          # 加载分区信息
          sudo partx -a "$LOOP" || true

          # 用 sfdisk JSON 解析第二分区 (rootfs) 的起始扇区, 避免硬编码
          START=$(sudo sfdisk -d "$LOOP" --json | jq -r '.partitiontable.partitions[1].start')
          echo "Partition 2 start sector: $START"
          if [ -z "$START" ] || [ "$START" = "null" ]; then
            echo "无法获取第二分区起点扇区"
            sudo losetup -d "$LOOP"
            exit 1
          fi

          # 用 fdisk 删除并重建第二分区, 保留起点扇区
          # 顺序: p -> d 2 -> n p 2 -> 起点扇区 -> 默认结束(末尾) -> w
          # 注意: 新版 util-linux fdisk 删除分区2时的 ext4 签名提示仅是信息性,
          # 重建使用相同起点扇区会保留文件系统签名, 无需单独应答 N。
          # fdisk 重读分区表在 loop 设备上常返回非零, 用 partx/partprobe 兜底更新。
          printf 'p\nd\n2\nn\np\n2\n%s\n\nw\n' "$START" | sudo fdisk "$LOOP" || true

          # 更新分区表
          sudo partx -u "${LOOP}p2" || true
          sudo partx -u "$LOOP" || true

          # 文件系统检测与同步
          # e2fsck 退出码: 0=无错误 1=已修复错误 2=已修复需重启, 均视为成功;
          # 退出码 >=4 才是真正异常, 单独捕获判断。
          set +e
          sudo e2fsck -f -y "${LOOP}p2"
          RC=$?
          set -e
          if [ "$RC" -ge 4 ]; then
            echo "e2fsck 失败, 退出码 $RC"
            sudo losetup -d "$LOOP"
            exit 1
          fi
          sudo resize2fs "${LOOP}p2"

          # 卸载
          sudo partx -d "$LOOP" || true
          sudo losetup -d "$LOOP"

      - name: Compress image
        run: |
          gzip -9 "${{ steps.vars.outputs.file }}"
          ls -lh "${{ steps.vars.outputs.file }}.gz"
          mv "${{ steps.vars.outputs.file }}.gz" "${{ steps.vars.outputs.out }}"

      - name: Delete existing release (same tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.vars.outputs.version }}"
          echo "删除已存在的 tag/release: $TAG"
          gh release delete "$TAG" --yes --cleanup-tag || true

      - name: Create release and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.vars.outputs.version }}"
          NOTES_FILE="$(mktemp)"
          {
            printf 'OpenWrt %s x86-64 ext4-combined 镜像，扩容 %sMB。\n\n' "${{ steps.vars.outputs.version }}" "${{ steps.vars.outputs.size }}"
            printf -- '- 架构: x86-64\n'
            printf -- '- 版本: %s\n' "${{ steps.vars.outputs.version }}"
            printf -- '- 扩容: %sMB\n' "${{ steps.vars.outputs.size }}"
            printf -- '- 下载源: %s\n\n' "${{ github.event.inputs.mirror }}"
            printf '文件: %s\n\n' "${{ steps.vars.outputs.out }}"
            printf '使用方法: 解压后写入磁盘/U盘。\n'
            printf '```\n'
            printf 'gzip -d %s\n' "${{ steps.vars.outputs.out }}"
            printf 'dd if=%s of=/dev/sdX bs=1M\n' "${{ steps.vars.outputs.file }}"
            printf '```\n'
          } > "$NOTES_FILE"
          gh release create "$TAG" \
            "${{ steps.vars.outputs.out }}" \
            --title "OpenWrt ${{ steps.vars.outputs.version }} (x86-64, +${{ steps.vars.outputs.size }}MB)" \
            --notes-file "$NOTES_FILE"
